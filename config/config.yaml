mcp_servers:
  hugging_face:
    url: https://huggingface.co/mcp
    auth: oauth
    enabled: true
  postman:
    url: https://mcp.postman.com/minimal
    auth: oauth
    enabled: false
  railway:
    url: https://mcp.railway.com
    auth: oauth
    enabled: false
    tools:
      exclude:
      - railway-agent
  supabase:
    url: https://mcp.supabase.com/mcp
    auth: oauth
    enabled: true
  vercel:
    url: https://mcp.vercel.com
    auth: oauth
    enabled: false
  calendly:
    url: https://mcp.calendly.com
    auth: oauth
    enabled: true
    tools:
      exclude:
      - list_calendly_skills
      - load_calendly_skill
  canva:
    url: https://mcp.canva.com/mcp
    auth: oauth
    enabled: true
  notion:
    url: https://mcp.notion.com/mcp
    auth: oauth
    enabled: true
  figma:
    url: https://mcp.figma.com/mcp
    auth: oauth
    enabled: true
  n8n:
    command: C:/Users/ELCOT/AppData/Local/hermes/mcp-installs/n8n/.venv/Scripts/python.exe
    args:
    - C:/Users/ELCOT/AppData/Local/hermes/mcp-installs/n8n/server.py
    env:
      N8N_MCP_ENV: C:/Users/ELCOT/.config/n8n-mcp/env
    timeout: 120
    connect_timeout: 30
    sampling:
      enabled: false
  zoho_crm:
    command: /Users/apple/.hermes/hermes-agent/venv/bin/python
    args:
    - /Users/apple/.hermes/scripts/zoho_crm_mcp_server.py
    env:
      ZOHO_CRM_ACCESS_TOKEN: "***REDACTED***"
    timeout: 60
    connect_timeout: 30
    sampling:
      enabled: false
  scrapegraph_mcp:
    command: /Users/apple/.hermes/bin/uvx
    args:
    - '@ScrapeGraphAI/scrapegraph-mcp'
    env:
      SGAI_API_KEY: "***REDACTED***"
    timeout: 300
    connect_timeout: 60
    sampling:
      enabled: true
