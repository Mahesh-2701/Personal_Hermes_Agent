# ═══════════════════════════════════════════════════════════════════════════════
# HERMES CONFIG TEMPLATE: LOCAL DEVELOPMENT ENVIRONMENT
# ═══════════════════════════════════════════════════════════════════════════════
#
# PURPOSE:
#   Optimized for developer machine. Fast iteration, debugging, security off.
#
# TYPICAL USE:
#   - Single-user local setup
#   - Need to see full logs, reasoning, errors
#   - Testing unsafe features (no security scanning)
#   - Quick iteration loops (minimal compression)
#
# USAGE:
#   cp templates/config-dev.yaml ~/.hermes/config.yaml
#   hermes
#
# ═══════════════════════════════════════════════════════════════════════════════

model:
  default: claude-haiku-4-5-20251001  # Fast, cheap for dev
  provider: anthropic

database:
  journal_mode: wal

runtime:
  nofile_soft_limit: 4096

agent:
  max_turns: 150
  verbose: true  # ← VERBOSE: See all reasoning for debugging
  reasoning_effort: medium
  personalities: {}

terminal:
  backend: local  # ← LOCAL: No Docker overhead
  cwd: .
  timeout: 600   # ← LONG TIMEOUT: Let builds run
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300

web:
  backend: firecrawl

browser:
  inactivity_timeout: 120
  extension_control:
    enabled: false
  cloud_provider: local

tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false  # ← SOFT: Warnings only
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5

compression:
  enabled: false  # ← DISABLED: Keep full context for debugging
  checkpoint_required: false
  progress_notices: false
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  min_tail_user_messages: 1
  max_attempts: 3
  proactive_prune_tokens: 0
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
  codex_responses_native: false
  codex_responses_compact_threshold: 200000
  idle_compact_after_seconds: 0

prompt_caching:
  cache_ttl: 5m

display:
  compact: false
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: true  # ← SHOW: Full reasoning for debugging
  background_process_notifications: verbose  # ← VERBOSE
  streaming: true
  skin: default
  interim_assistant_messages: true
  tool_progress: all  # ← ALL: Every tool call visible
  cleanup_progress: true  # ← VERBOSE: See cleanup
  long_running_notifications: true
  busy_ack_detail: true

stt:
  enabled: true
  language: en
  local:
    model: base
  openai:
    model: whisper-1
    language: ''

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  provider: honcho

delegation:
  max_iterations: 250

skills:
  creation_nudge_interval: 15

command_allowlist:
  - script execution via heredoc

kanban:
  review_dispatch: true

code_execution:
  timeout: 300
  max_tool_calls: 50

streaming:
  enabled: true  # ← ENABLED: Better UX

onboarding:
  seen: {}  # ← RESET: See all prompts

telemetry:
  shared_metrics:
    enabled: false  # ← OFF: No data sharing in dev

updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash

computer_use:
  backend: cua

session_reset:
  mode: none
  idle_minutes: 1440
  at_hour: 4

group_sessions_per_user: true

platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - cronjob
    - delegation
    - file
    - image_gen
    - kanban
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web

mcp_servers:
  hugging_face:
    url: https://huggingface.co/mcp
    auth: oauth
    enabled: true
  supabase:
    url: https://mcp.supabase.com/mcp
    auth: oauth
    enabled: true

_config_version: 40
