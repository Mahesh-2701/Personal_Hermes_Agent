# ─────────────────────────────────────────────────────────────────────────────
# 27. MCP SERVERS (Model Context Protocol — External Tool Sources)
# ─────────────────────────────────────────────────────────────────────────────
# MCP servers expose external tools/data sources to Hermes. Each server
# must be configured with auth, endpoint, and optional tool filters.
#
# How MCP works:
#   1. MCP server exposes tools via JSON-RPC over stdio or HTTP.
#   2. Hermes discovers tools on startup.
#   3. Agent uses tools from MCP + built-ins as a unified toolset.
#   4. Auth can be OAuth (user-managed), API key (env var), or none.
#
mcp_servers:
  # HuggingFace hub integration (model search, downloads)
  hugging_face:
    url: https://huggingface.co/mcp
    auth: oauth  # User must authorize once
    enabled: true

  # Postman API testing & documentation
  postman:
    url: https://mcp.postman.com/minimal
    auth: oauth
    enabled: false  # Optional, disabled by default

  # Railway deployment platform
  railway:
    url: https://mcp.railway.com
    auth: oauth
    enabled: false
    # Exclude specific tools from this server
    tools:
      exclude:
        - railway-agent

  # Supabase (PostgreSQL + realtime DB)
  supabase:
    url: https://mcp.supabase.com/mcp
    auth: oauth
    enabled: true

  # Vercel deployment platform
  vercel:
    url: https://mcp.vercel.com
    auth: oauth
    enabled: false

  # Calendly scheduling
  calendly:
    url: https://mcp.calendly.com
    auth: oauth
    enabled: true
    tools:
      exclude:
        - list_calendly_skills  # Exclude noisy tools
        - load_calendly_skill

  # Canva design tool
  canva:
    url: https://mcp.canva.com/mcp
    auth: oauth
    enabled: true

  # Notion database & document tool
  notion:
    url: https://mcp.notion.com/mcp
    auth: oauth
    enabled: true

  # Figma design tool
  figma:
    url: https://mcp.figma.com/mcp
    auth: oauth
    enabled: true

  # n8n workflow automation (local/self-hosted)
  n8n:
    # Command to run n8n MCP server
    command: C:/Users/ELCOT/AppData/Local/hermes/mcp-installs/n8n/.venv/Scripts/python.exe
    args:
      - C:/Users/ELCOT/AppData/Local/hermes/mcp-installs/n8n/server.py
    # Environment variables for the MCP server
    env:
      N8N_MCP_ENV: C:/Users/ELCOT/.config/n8n-mcp/env
    # Timeout for MCP server startup (seconds)
    timeout: 120
    # Timeout for initial connection (seconds)
    connect_timeout: 30
    sampling:
      enabled: false

  # Zoho CRM (customer relationship management)
  zoho_crm:
    # Local MCP server script
    command: /Users/apple/.hermes/hermes-agent/venv/bin/python
    args:
      - /Users/apple/.hermes/scripts/zoho_crm_mcp_server.py
    # API token stored in env var (NOT in this file — see .env)
    env:
      ZOHO_CRM_ACCESS_TOKEN: FILL_FROM_.env
    timeout: 60
    connect_timeout: 30
    sampling:
      enabled: false


# ═══════════════════════════════════════════════════════════════════════════════
# APPENDIX: OPTIONAL / COMMENTED SETTINGS
# ═══════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# A. SECURITY (Commented — Uncomment to Enable)
# ─────────────────────────────────────────────────────────────────────────────
# Automatic redaction of secrets (API keys, passwords, tokens) in logs
# and responses. Enabled by default if not configured.
#
# security:
#   # Redact secrets? (API keys, tokens, passwords)
#   # "true" = mask before showing to user/model
#   redact_secrets: true
#
#   # Use Tirith (static analysis tool) to scan code before execution?
#   # Detects injection patterns, hardcoded creds, common vulns.
#   tirith_enabled: true
#   tirith_path: "tirith"        # Path to tirith binary
#   tirith_timeout: 5            # Max seconds for scan
#   tirith_fail_open: true       # Execute code even if Tirith scan fails?


# ─────────────────────────────────────────────────────────────────────────────
# B. FALLBACK MODEL (Commented — Uncomment to Enable Provider Failover)
# ─────────────────────────────────────────────────────────────────────────────
# If primary provider is down (rate limited, quota exceeded, etc.),
# automatically fail over to another provider's model.
#
# Failover triggers:
#   - 429 (rate limit)
#   - 529 (provider overloaded)
#   - 503 (service error)
#   - Connection timeout
#
# Supported providers:
#   - openrouter     (requires OPENROUTER_API_KEY env var)
#   - openai-codex   (OAuth — Hermes auth)
#   - nous           (OAuth — Hermes auth)
#   - zai            (requires ZAI_API_KEY)
#   - kimi-coding    (requires KIMI_API_KEY)
#   - minimax        (requires MINIMAX_API_KEY)
#   - bedrock        (AWS IAM)
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4
#
# For custom OpenAI-compatible endpoints:
# fallback_model:
#   provider: custom-openai
#   base_url: https://your-api.example.com/v1
#   model: gpt-4
#   key_env: CUSTOM_OPENAI_API_KEY


